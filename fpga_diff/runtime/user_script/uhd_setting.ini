# UHD trigger conditions for the NutShell fpga_diff probe build.
# Group names must match trigger_net -group in uvhs/script/probe.tcl and the
# trigger -set call in user_script/hw_run_uhd.tcl. Signal paths are the fe-stage
# RTL names, same as in probe.tcl.

# Group uvhs_lite: difftest streaming starts. Trigger on the first C2H tvalid
# beat only; stream_enable is left commented out because it rises earlier and
# would fire the trigger before any data-path activity.
[uvhs_lite]
LOGIC = OR
#fpga_top_debug.core_def.difftest_stream_enable_pcie = 1
fpga_top_debug.core_def.difftest_to_host_axis_tvalid = 1

# Group uvhs_bar0: any XDMA AXI-Lite read on the BAR0 config channel.
[uvhs_bar0]
LOGIC = OR
fpga_top_debug.core_def.XDMA_AXI_LITE_arvalid = 1

# Group uvhs_bar0_sys: BAR0 debug status read mux fired (sys_clk domain).
[uvhs_bar0_sys]
LOGIC = OR
fpga_top_debug.core_def.uvhs_debug_ar_fire = 1

# Final trigger = OR of the groups listed here. Start with uvhs_lite only
# (difftest start); add uvhs_bar0 / uvhs_bar0_sys to also trigger on host BAR0
# activity instead.
[UHD_FINAL_CONDITIONS_LOGIC]
LOGIC = OR
uvhs_lite
